<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timesheet Approved</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #fff;
      border-radius: 16px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: 0 2px 24px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
    }
    .tick {
      width: 72px;
      height: 72px;
      background: #1a8a7a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: #fff;
    }
    h1 {
      font-size: 22px;
      color: #0d1b2e;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #4a5a72;
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      background: #1b4f8c;
      color: #fff;
      border-radius: 8px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #8fa0b8;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="tick">&#10003;</div>
    <h1>Weekly Timesheet Approved</h1>
    <p>The timesheet has been approved successfully.</p>
    <a href="https://crmkta.com">Open KTA System</a>
    <p class="footer">Kiwi Trade Apprentices &middot; payroll@kta.org.nz</p>
  </div>
</body>
</html>
